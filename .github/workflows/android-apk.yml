name: Compilar APK Android - RJP TM Tactics

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'android-custom/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: APK Android + WebApp
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java 21 (Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Garantir Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testar motor tático
        run: npm test

      - name: Compilar interface WebApp
        run: npm run build

      - name: Gerar projeto Android
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      # Obrigatório: a mesma chave em TODAS as compilações.
      # Executar UMA vez "bash scripts/configurar-assinatura-github.sh" no Codespaces
      # para criar o segredo RJP_ANDROID_DEBUG_KEYSTORE_BASE64 no GitHub.
      - name: Validar assinatura persistente
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.RJP_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::Assinatura não configurada. Abre um GitHub Codespace e executa bash scripts/configurar-assinatura-github.sh; consulta ASSINATURA_E_ATUALIZACOES.md.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null || {
            echo '::error::A chave do segredo é inválida ou não corresponde a uma debug.keystore Android.'
            exit 1
          }
          echo 'Assinatura persistente validada.'

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para transferência
        uses: actions/upload-artifact@v4
        with:
          name: RJP-TM-Tactics-APK-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar WebApp compilada
        uses: actions/upload-artifact@v4
        with:
          name: RJP-TM-Tactics-WebApp
          path: dist/
          if-no-files-found: error
          retention-days: 30
