name: Compilar APK Android - RJP TM Tactics

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'android-custom/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: APK Android + WebApp
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java 21 (Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Garantir Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testar motor tático
        run: npm test

      - name: Compilar interface WebApp
        run: npm run build

      - name: Gerar projeto Android
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      # Se houver uma assinatura persistente válida, reutiliza-a.
      # Caso contrário, compila uma APK de testes com assinatura temporária.
      - name: Preparar assinatura Android
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.RJP_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          KEY="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            if printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEY" 2>/dev/null && \
               keytool -list -keystore "$KEY" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              chmod 600 "$KEY"
              echo 'RJP_SIGN_MODE=assinatura-persistente' >> "$GITHUB_ENV"
              echo '### APK com assinatura persistente' >> "$GITHUB_STEP_SUMMARY"
              echo 'Usa a chave de assinatura configurada no repositório.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo '::warning::Segredo de assinatura inválido. A compilar APK de testes com uma nova assinatura.'
          else
            echo '::warning::Sem assinatura persistente. A compilar APK de testes com uma nova assinatura.'
          fi
          rm -f "$KEY"
          echo 'RJP_SIGN_MODE=chave-temporaria' >> "$GITHUB_ENV"
          echo '### APK de teste: assinatura temporária' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pode exigir desinstalar a APK anterior. Faz uma exportação dos dados antes de reinstalar.' >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para transferência
        uses: actions/upload-artifact@v4
        with:
          name: RJP-TM-Tactics-APK-${{ env.RJP_SIGN_MODE }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar WebApp compilada
        uses: actions/upload-artifact@v4
        with:
          name: RJP-TM-Tactics-WebApp
          path: dist/
          if-no-files-found: error
          retention-days: 30
