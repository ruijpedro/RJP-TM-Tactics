name: Compilar APK Android - RJP TM Tactics

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'android-custom/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: APK Android + WebApp
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java 21 (Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Garantir Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testar motor tático
        run: npm test

      - name: Compilar interface WebApp
        run: npm run build

      - name: Gerar projeto Android
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      # Opcional, mas essencial para atualizar APKs SEM desinstalar:
      # guarda a mesma debug.keystore no segredo RJP_ANDROID_DEBUG_KEYSTORE_BASE64.
      - name: Recuperar assinatura persistente (opcional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.RJP_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo 'Assinatura persistente configurada para as atualizações.'
          else
            echo '::warning::Sem RJP_ANDROID_DEBUG_KEYSTORE_BASE64. O Android pode exigir desinstalar a APK anterior para atualizar.'
          fi

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para transferência
        uses: actions/upload-artifact@v4
        with:
          name: RJP-TM-Tactics-APK-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar WebApp compilada
        uses: actions/upload-artifact@v4
        with:
          name: RJP-TM-Tactics-WebApp
          path: dist/
          if-no-files-found: error
          retention-days: 30
